# Build and test gate for Windows, and the publishing half of a release.
#
# Covers the unconditional work: compile the game with build.bat, confirm the
# binary reports the version CMake resolved for it, and run every suite
# registered with CTest.
#
# On a tag, one job more: the archive is packaged and attached to a draft
# release.

name: CI

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-build-and-test:
    name: Windows build and tests
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      # setup-msys2 documents this as a known problem with actions/checkout:
      # checkout can leave CRLF in the working tree, which the tools MSYS2
      # brings along then disagree with about what has changed. `input` keeps
      # the files exactly as committed, so CtrNativeVersion.cmake does not
      # resolve a phantom -dirty.
      - name: Keep the checkout free of line-ending conversion
        run: git config --global core.autocrlf input

      - name: Check out the repository
        uses: actions/checkout@v4
        with:
          # cmake/CtrNativeVersion.cmake derives the version with
          # `git describe --tags`, so the tags have to come along with the
          # history. A shallow clone resolves nothing and quietly falls back to
          # 0.0.0-dev, which is exactly the kind of wrong version a build gate
          # exists to catch.
          fetch-depth: 0

      - name: Set up the MSYS2 MinGW32 toolchain
        id: msys2
        uses: msys2/setup-msys2@v2
        with:
          # The 32-bit environment this build requires. Upstream has deprecated
          # MINGW32 and MINGW64 in favour of 64-bit ones, which this project
          # cannot use: CMakeLists.txt rejects any target that is not 32-bit.
          # The warning is therefore expected, not a signal about this build.
          msystem: MINGW32
          suppress-deprecation-warnings: msystem-mingw32
          # Reuse the MSYS2 that ships in the runner image instead of
          # downloading and extracting a fresh base on every run. The action
          # looks for it at C:\msys64 and fails outright rather than falling
          # back to a download, so this gives up newer MSYS2 point releases and
          # accepts a hard failure if a future image ever drops MSYS2.
          #
          # Only the base install is skipped. The action still caches the
          # downloaded packages under var/cache/pacman/pkg, and still unpacks
          # them, which is where the remaining setup time goes.
          release: false
          update: true
          # One whitespace-separated list, installed through pacman. This is the
          # same package set build.bat prints when a tool is missing.
          install: >-
            git
            mingw-w64-i686-gcc
            mingw-w64-i686-cmake
            mingw-w64-i686-make

      - name: Put the MinGW32 toolchain on PATH
        shell: pwsh
        run: |
          # The action puts only its own msys2.cmd shim on PATH, not the
          # toolchain, so build.bat would stop at its first `where` check. This
          # is the directory README step 3 asks a developer to put on their
          # system PATH, which is the environment build.bat is written for.
          $msys2 = '${{ steps.msys2.outputs.msys2-location }}'
          if ([string]::IsNullOrWhiteSpace($msys2)) {
            # The action's default install location, in case a v2 release old
            # enough to lack the output ever resolves.
            $msys2 = 'C:\msys64'
          }
          Add-Content -LiteralPath $env:GITHUB_PATH -Value "$msys2\mingw32\bin"

      # SDL is compiled from vendored source and dominates a cold build, so
      # its build tree is cached and reused. The action carries the key it
      # needs and the reason the restored files have to be touched; see
      # .github/actions/cache-sdl/action.yml.
      - name: Restore the SDL build cache
        uses: ./.github/actions/cache-sdl

      - name: Build
        shell: cmd
        run: .\build.bat

      - name: Verify the binary reports the resolved version
        # Worth running on a tag build above all: there `git describe` sits on
        # the tag itself, so the expected version carries no +N.g<hash> distance
        # metadata and the binary has to report the bare release number. That is
        # the check standing between a bad resolve and a shipped release.
        shell: pwsh
        run: ./scripts/verify_version.ps1

      - name: Test
        shell: pwsh
        run: |
          # ctest reports on stdout and signals failure through its exit code,
          # so the exit code is what this step turns on.
          $ErrorActionPreference = 'Continue'
          ctest --test-dir build --output-on-failure
          if ($LASTEXITCODE -ne 0) {
            throw "ctest reported failures."
          }

      # Tag builds only
      - name: Upload the verified build
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: windows-i686-build
          path: build/ctr_native_expanded.exe

  release:
    name: Package and publish the draft release
    needs: windows-build-and-test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - name: Check out the tag
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check the tag
        id: resolve
        env:
          INPUT_TAG: ${{ github.ref_name }}
        run: ./scripts/release/resolve-tag.sh

      - name: Download the verified build
        uses: actions/download-artifact@v4
        with:
          name: windows-i686-build
          path: build

      - name: Package the release
        shell: pwsh
        run: ./scripts/package-windows.ps1 -Version '${{ steps.resolve.outputs.tag }}'

      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.resolve.outputs.tag }}
        run: ./scripts/release/publish-release.sh
