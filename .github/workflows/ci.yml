# Build and test gate for Windows, and the publishing half of a release.
#
# Covers the unconditional work: compile the game with build.bat, confirm the
# binary reports the version CMake resolved for it, and run every suite
# registered with CTest.
#
# On a tag, one job more: the archive is packaged and attached to a draft
# release.

name: CI

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-build-and-test:
    name: Windows build and tests
    runs-on: windows-2025
    timeout-minutes: 60

    steps:
      # setup-msys2 documents this as a known problem with actions/checkout:
      # checkout can leave CRLF in the working tree, which the tools MSYS2
      # brings along then disagree with about what has changed. `input` keeps
      # the files exactly as committed, so CtrNativeVersion.cmake does not
      # resolve a phantom -dirty.
      - name: Keep the checkout free of line-ending conversion
        run: git config --global core.autocrlf input

      - name: Check out the repository
        uses: actions/checkout@v4
        with:
          # cmake/CtrNativeVersion.cmake derives the version with
          # `git describe --tags`, so the tags have to come along with the
          # history. A shallow clone resolves nothing and quietly falls back to
          # 0.0.0-dev, which is exactly the kind of wrong version a build gate
          # exists to catch.
          fetch-depth: 0

      - name: Set up cached CMake and MSYS2
        uses: ./.github/actions/setup-build-tools

      # Cache compiler results.
      # ccache validates source, header, compiler and flag changes itself.
      - name: Restore the compiler cache
        uses: ./.github/actions/cache-compiler

      # Separate from ccache: preserve the results of SDL's configure probes.
      # Exact environment/configuration key only; CMake still runs every time.
      - name: Restore the CMake configuration cache
        uses: ./.github/actions/cache-cmake

      - name: Build
        shell: cmd
        env:
          CMAKE_C_COMPILER_LAUNCHER: ccache
          CMAKE_CXX_COMPILER_LAUNCHER: ccache
        # SDL's PCH prevents ccache reuse with its default correctness checks.
        # Prefer cacheable objects on fresh CI runners; local builds keep PCH.
        run: .\build.bat -DCMAKE_DISABLE_PRECOMPILE_HEADERS=ON

      - name: Show compiler cache statistics
        if: always()
        shell: pwsh
        run: ccache --show-stats --verbose

      - name: Verify the binary reports the resolved version
        # Worth running on a tag build above all: there `git describe` sits on
        # the tag itself, so the expected version carries no +N.g<hash> distance
        # metadata and the binary has to report the bare release number. That is
        # the check standing between a bad resolve and a shipped release.
        shell: pwsh
        run: ./scripts/verify_version.ps1

      - name: Test
        shell: pwsh
        run: |
          # ctest reports on stdout and signals failure through its exit code,
          # so the exit code is what this step turns on.
          $ErrorActionPreference = 'Continue'
          ctest --test-dir build --output-on-failure
          if ($LASTEXITCODE -ne 0) {
            throw "ctest reported failures."
          }

      # Tag builds only
      - name: Upload the verified build
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: windows-i686-build
          path: build/crash_team_racing_expanded.exe

      - name: Upload the verified track import tools
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: windows-track-tools
          path: assets/tools/
          if-no-files-found: error

  release:
    name: Package and publish the draft release
    needs: windows-build-and-test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - name: Check out the tag
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check the tag
        id: resolve
        env:
          INPUT_TAG: ${{ github.ref_name }}
        run: ./scripts/release/resolve-tag.sh

      - name: Download the verified build
        uses: actions/download-artifact@v4
        with:
          name: windows-i686-build
          path: build

      - name: Download the verified track import tools
        uses: actions/download-artifact@v4
        with:
          name: windows-track-tools
          path: assets/tools

      - name: Package the release
        shell: pwsh
        run: ./scripts/package-windows.ps1 -Version '${{ steps.resolve.outputs.tag }}'

      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.resolve.outputs.tag }}
        run: ./scripts/release/publish-release.sh
