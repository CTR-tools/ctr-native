name: Cache compiler results
description: Reuses validated compiler results for Ninja builds, including SDL.

runs:
  using: composite
  steps:
    - name: Configure ccache
      shell: pwsh
      run: |
        $env:CCACHE_DIR = "$env:GITHUB_WORKSPACE/.cache/ccache"
        "CCACHE_DIR=$env:CCACHE_DIR" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
        "CCACHE_COMPILERCHECK=content" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
        ccache --max-size=500M
        if ($LASTEXITCODE -ne 0) { throw 'ccache configuration failed.' }

    - name: Restore compiler results
      uses: actions/cache@v4
      with:
        path: .cache/ccache
        key: ccache-${{ runner.os }}-i686-v1-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
        restore-keys: |
          ccache-${{ runner.os }}-i686-v1-

    - name: Reset statistics for this run
      shell: pwsh
      run: |
        ccache --zero-stats
        if ($LASTEXITCODE -ne 0) { throw 'ccache statistics reset failed.' }
